<!DOCTYPE html> <!-- Tells browser that this is a HTML doc -->
<html lang="en">

<head>

<title>Calculator</title> <!--title on tab-->

<meta charset="UTF-8"> <!--for emojis nd english characterset-->

<link rel="stylesheet" href="cssStyle.css"> <!--links the external css stylesheet for the style of the webpage-->

<script src="jScript.js" defer></script>

</head>

<body>

   <div class="calc">

      <input id="display" readonly>
      
     <div class="keys-grid">

         
            
            <button onclick="pressToDisplay('+')">+</button>
            <button onclick="pressToDisplay('-')">-</button>
            <button onclick="pressToDisplay('*')">*</button>
            <button onclick="pressToDisplay('/')">/</button>
         
            <button onclick="pressToDisplay('7')">7</button>
            <button onclick="pressToDisplay('8')">8</button>
            <button onclick="pressToDisplay('9')">9</button>

            <button class="equals-button" onclick="calculate()">=</button>

            <button onclick="pressToDisplay('4')">4</button>
            <button onclick="pressToDisplay('5')">5</button>
            <button onclick="pressToDisplay('6')">6</button>

            <button onclick="pressToDisplay('1')">1</button>
            <button onclick="pressToDisplay('2')">2</button>
            <button onclick="pressToDisplay('3')">3</button>

            <button onclick="pressToDisplay('0')">0</button>
            <button onclick="pressToDisplay('.')">.</button>
            <button onclick="clearDisplay()">C</button>
    
     </div>

   </div>

</body>
